name: Merge main into open PRs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge main into open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # TSV: number, branch, owner
          gh pr list --base main --state open \
            --json number,headRefName,headRepositoryOwner \
            --jq '.[] | [.number, .headRefName, .headRepositoryOwner.login] | @tsv' \
          | while IFS=$'\t' read -r number branch owner; do

            repo_owner=$(gh repo view --json owner --jq '.owner.login')
            if [ "$owner" != "$repo_owner" ]; then
              echo "PR #$number: skipping (fork from $owner)"
              continue
            fi

            echo "PR #$number: merging main into $branch..."

            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"

            if git merge origin/main --no-edit; then
              git push origin "$branch"
              echo "PR #$number: done"
            else
              git merge --abort
              echo "PR #$number: conflict — skipping"
            fi
          done
