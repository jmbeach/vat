[package]
name = "vat"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
# "string" lets cmd_completions rebuild a Command with a runtime-owned name.
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
rand = "0.8"
serde_yaml = "0.9"
thiserror = "1"
toml = { version = "0.8", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
pedantic = "warn"
